[project]
name = "logistics"
version = "0.1.0"
description = "A Telegram bot that aggregates freight/logistics posts from external sources (e.g. Telegram channels), parses routes and prices, and delivers matching listings to subscribed users."
readme = "README.md"
authors = [
    { name = "yehor-core", email = "kanunnikovyehor@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.30.0",
    "pre-commit>=4.6.2",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
logistics = "src:main"

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E", 
    "W",
    "F",
    "I",
    "B",
    "ASYNC",
    "S",
    "SIM",
    "UP",
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"src/bot/*" = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]
